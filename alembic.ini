# Evidence-store migrations. The URL comes from settings, not this file.
#   alembic revision --autogenerate -m "..."   draft one, then review it
[alembic]
script_location = grounded:migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
