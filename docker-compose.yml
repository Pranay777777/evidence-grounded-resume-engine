services:
  app:
    build: .
    env_file: [.env]
    environment:
      APP_ENV: local
      # Inside the container: listen on all interfaces (the port mapping is
      # the boundary), and reach the database by its service name.
      HOST: 0.0.0.0
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  db:
    # pgvector for dense retrieval (step 44); Postgres 16 underneath.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # 5433 on the host so this stack and the lakehouse (5432) can coexist.
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
