projects:
  - id: agentic-pipeline-copilot
    name: agentic-pipeline-copilot
    summary: Turns a plain-English data spec into a validated, tested PySpark notebook and an opened pull request.
    repo_url: https://github.com/Pranay777777/agentic-pipeline-copilot
  - id: evidence-grounded-resume-engine
    name: evidence-grounded-resume-engine
    summary: Résumé generation where every claim cites a verified evidence record and unsupported claims are dropped.
    repo_url: https://github.com/Pranay777777/evidence-grounded-resume-engine
  - id: asl-realtime-inference
    name: asl-realtime-inference
    summary: Real-time ASL alphabet recognizer with ONNX FP32/INT8 inference and a calibrated abstain threshold.
    repo_url: https://github.com/Pranay777777/asl-realtime-inference
  - id: neighborhood-skill-swap
    name: neighborhood-skill-swap
    summary: Full-stack skill-swap board - React, FastAPI, Postgres - with hardened auth and tested authorization.
    repo_url: https://github.com/Pranay777777/Neighborhood-Skill-Swap-Platform

