[project]
name = "grounded"
version = "0.1.0"
description = "Resume generation where every claim cites verified evidence, with a measured fabrication rate"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13.5",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.18",
  "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.8",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pip-audit>=2.10.1",
  "types-PyYAML>=6.0",
  "httpx2>=2.13",
]

# The dense embedding model (ADR-004): ONNX via fastembed, no PyTorch.
embeddings = [
  "fastembed>=0.5",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Templates are not Python files; without this a wheel (the Docker image)
# ships the admin UI with no pages.
[tool.setuptools.package-data]
grounded = ["api/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["src"]
